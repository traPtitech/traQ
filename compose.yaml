services:
  backend:
    build: ./
    restart: always
    environment:
      TRAQ_ALLOWSIGNUP: true
      TRAQ_ORIGIN: http://localhost:3000
      TRAQ_MARIADB_HOST: mysql
      TRAQ_ES_URL: http://es:9200
      TRAQ_PPROF: "true"
      TRAQ_STORAGE_TYPE: composite
      TRAQ_STORAGE_S3_BUCKET: traq
      TRAQ_STORAGE_S3_REGION: ap-northeast-1
      TRAQ_STORAGE_S3_ENDPOINT: http://s3:9000
      TRAQ_STORAGE_S3_ACCESSKEY: &s3-access-key GK0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_SECRETKEY: &s3-secret-key 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_CACHEDIR: ./storage
      TRAQ_STORAGE_COMPOSITE_REMOTE: s3
    entrypoint: ./traQ serve --dev --skip-init-emojis
    expose:
      - "80"
      - "6060"
    ports:
      - "6060:6060"
    depends_on:
      mysql:
        condition: service_healthy
      es:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - app:/app/storage

  frontend:
    build:
      context: ./dev
      dockerfile: Dockerfile-frontend
    restart: always
    expose:
      - "80"
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mariadb:13.0.2@sha256:d4fdec0510ad498e4f3127da30a99df3745bd6d5e611ae6ac5f76403d9284a8d
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: traq
    # conohaのDBのデフォルトCharsetはutf8
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    expose:
      - "3306"
    ports:
      - "3002:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=password --execute "SHOW DATABASES;"
      interval: 1s
      timeout: 10s
      retries: 60

  es:
    image: ghcr.io/traptitech/es-with-sudachi:8.8.1-3.1.0@sha256:01bbe21708d961195a0f6346bedac2aba1438c829b336f1d100a1d28610c1c26
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.http.ssl.enabled: false
      ELASTIC_PASSWORD: password
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./dev/es_jvm.options:/usr/share/elasticsearch/config/jvm.options.d/es_jvm.options
      - es:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 1s
      timeout: 10s
      retries: 60

  adminer:
    image: adminer:6.0.1@sha256:51262b555d9e8ac3e1fa197eec41a3f47d05aea5520ac2ccc78a03ffc7d39b3a
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: nette
    expose:
      - "8080"
    ports:
      - "3001:8080"

  botdebugger:
    image: golang:1.27.1-alpine@sha256:4cb7ac979db5fcc41cae44b2227ba5ab8a51e8807f40d9ba4dee20a0ad960b5b
    restart: always
    volumes:
      - ./dev/bin:/app
    command: go run /app/bot_debugger.go -p 80

  s3:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: always
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - traq.s3 # {bucket}.s3
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: *s3-access-key
      GARAGE_DEFAULT_SECRET_KEY: *s3-secret-key
      GARAGE_DEFAULT_BUCKET: traq
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "traq"]
      interval: 1s
      timeout: 10s
      retries: 60

volumes:
  app:
  mysql:
  es:
  garage:
