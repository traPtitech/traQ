services:
  backend:
    build: ./
    restart: always
    environment:
      TRAQ_ALLOWSIGNUP: true
      TRAQ_ORIGIN: http://localhost:3000
      TRAQ_MARIADB_HOST: mysql
      TRAQ_ES_URL: http://es:9200
      TRAQ_PPROF: "true"
      TRAQ_STORAGE_TYPE: composite
      TRAQ_STORAGE_S3_BUCKET: traq
      TRAQ_STORAGE_S3_REGION: ap-northeast-1
      TRAQ_STORAGE_S3_ENDPOINT: http://s3:9000
      TRAQ_STORAGE_S3_ACCESSKEY: &s3-access-key GK0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_SECRETKEY: &s3-secret-key 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_FORCEPATHSTYLE: "true"
      TRAQ_STORAGE_S3_CACHEDIR: ./storage
      TRAQ_STORAGE_COMPOSITE_REMOTE: s3
    entrypoint: ./traQ serve --dev --skip-init-emojis
    expose:
      - "80"
      - "6060"
    ports:
      - "6060:6060"
    depends_on:
      mysql:
        condition: service_healthy
      es:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    volumes:
      - app:/app/storage

  frontend:
    build:
      context: ./dev
      dockerfile: Dockerfile-frontend
    restart: always
    expose:
      - "80"
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mariadb:13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: traq
    # conohaのDBのデフォルトCharsetはutf8
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    expose:
      - "3306"
    ports:
      - "3002:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=password --execute "SHOW DATABASES;"
      interval: 1s
      timeout: 10s
      retries: 60

  es:
    image: ghcr.io/traptitech/es-with-sudachi:8.8.1-3.1.0@sha256:01bbe21708d961195a0f6346bedac2aba1438c829b336f1d100a1d28610c1c26
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.http.ssl.enabled: false
      ELASTIC_PASSWORD: password
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./dev/es_jvm.options:/usr/share/elasticsearch/config/jvm.options.d/es_jvm.options
      - es:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 1s
      timeout: 10s
      retries: 60

  adminer:
    image: adminer:6.3.0@sha256:037125c2bc4836b4917d4fd08a16f817eac2848778c4e9aab87a8340aef08dfd
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: nette
    expose:
      - "8080"
    ports:
      - "3001:8080"

  botdebugger:
    image: golang:1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280
    restart: always
    volumes:
      - ./dev/bin:/app
    command: go run /app/bot_debugger.go -p 80

  s3:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: *s3-access-key
      RUSTFS_SECRET_KEY: *s3-secret-key
      RUSTFS_REGION: ap-northeast-1
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 1s
      timeout: 10s
      retries: 60

  s3-init:
    image: rustfs/rc:v0.1.38@sha256:3c080aff53f0d3b06554fd08711d05c80be40bd7e56001874d7df5e18d5ec88a
    depends_on:
      s3:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: *s3-access-key
      RUSTFS_SECRET_KEY: *s3-secret-key
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rc alias set local http://s3:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" --region ap-northeast-1 --bucket-lookup path --quiet &&
        rc bucket create local/traq --ignore-existing --quiet

volumes:
  app:
  mysql:
  es:
  rustfs:
