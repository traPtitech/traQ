services:
  backend:
    build: ./
    restart: always
    environment:
      TRAQ_ALLOWSIGNUP: true
      TRAQ_ORIGIN: http://localhost:3000
      TRAQ_MARIADB_HOST: mysql
      TRAQ_ES_URL: http://es:9200
      TRAQ_PPROF: "true"
      TRAQ_STORAGE_TYPE: composite
      TRAQ_STORAGE_S3_BUCKET: traq
      TRAQ_STORAGE_S3_REGION: ap-northeast-1
      TRAQ_STORAGE_S3_ENDPOINT: http://s3:9000
      TRAQ_STORAGE_S3_ACCESSKEY: &s3-access-key GK0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_SECRETKEY: &s3-secret-key 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TRAQ_STORAGE_S3_FORCEPATHSTYLE: "true"
      TRAQ_STORAGE_S3_CACHEDIR: ./storage
      TRAQ_STORAGE_COMPOSITE_REMOTE: s3
    entrypoint: ./traQ serve --dev --skip-init-emojis
    expose:
      - "80"
      - "6060"
    ports:
      - "6060:6060"
    depends_on:
      mysql:
        condition: service_healthy
      es:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    volumes:
      - app:/app/storage

  frontend:
    build:
      context: ./dev
      dockerfile: Dockerfile-frontend
    restart: always
    expose:
      - "80"
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mariadb:10.11.19@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: traq
    # conohaのDBのデフォルトCharsetはutf8
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    expose:
      - "3306"
    ports:
      - "3002:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=password --execute "SHOW DATABASES;"
      interval: 1s
      timeout: 10s
      retries: 60

  es:
    image: ghcr.io/traptitech/es-with-sudachi:8.8.1-3.1.0@sha256:01bbe21708d961195a0f6346bedac2aba1438c829b336f1d100a1d28610c1c26
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.http.ssl.enabled: false
      ELASTIC_PASSWORD: password
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./dev/es_jvm.options:/usr/share/elasticsearch/config/jvm.options.d/es_jvm.options
      - es:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 1s
      timeout: 10s
      retries: 60

  adminer:
    image: adminer:6.0.1@sha256:51262b555d9e8ac3e1fa197eec41a3f47d05aea5520ac2ccc78a03ffc7d39b3a
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: nette
    expose:
      - "8080"
    ports:
      - "3001:8080"

  botdebugger:
    image: golang:1.27.1-alpine@sha256:4cb7ac979db5fcc41cae44b2227ba5ab8a51e8807f40d9ba4dee20a0ad960b5b
    restart: always
    volumes:
      - ./dev/bin:/app
    command: go run /app/bot_debugger.go -p 80

  s3:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: *s3-access-key
      RUSTFS_SECRET_KEY: *s3-secret-key
      RUSTFS_REGION: ap-northeast-1
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 1s
      timeout: 10s
      retries: 60

  s3-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      s3:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: *s3-access-key
      RUSTFS_SECRET_KEY: *s3-secret-key
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rc alias set local http://s3:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" --region ap-northeast-1 --bucket-lookup path --quiet &&
        rc bucket create local/traq --ignore-existing --quiet

volumes:
  app:
  mysql:
  es:
  rustfs:
