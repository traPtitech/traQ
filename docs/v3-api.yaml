      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: all
          description: 全てのWebhookを取得します。権限が必要です。
      description: |-
        Webhookのリストを取得します。
        allがtrueで無い場合は、自分がオーナーのWebhookのリストを返します。
        all=trueでもAccessOthersWebhook権限がなければ自分のWebhookのみ返します。個々のWebhookの管理操作には所有者または同権限が必要です。
        必要なrole権限: `get_webhook`。
