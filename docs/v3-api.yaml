      operationId: getChannelSubscribers
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したチャンネルを通知購読しているユーザーのUUIDのリストを取得します。
        購読レベル2（未読管理・通知あり）のユーザーのみを返します。
        必要なrole権限: `get_channel_subscription`。
    patch:
      summary: チャンネルの通知購読者を編集
      responses:
        "204":
          description: |-
            No Content
            変更できました。
        "400":
          description: Bad Request
        "403":
          description: |-
            Forbidden
            指定したチャンネルの通知購読者は変更できません。
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      tags:
        - channel
        - notification
      operationId: editChannelSubscribers
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchChannelSubscribersRequest"
        description: ""
      description: |-
        指定したチャンネルの通知購読者を編集します。
        リクエストに含めなかったユーザーの通知購読状態は変更しません。
        また、存在しないユーザーを指定した場合は無視されます。
        EditChannelSubscription権限があれば全ユーザーの購読を変更できます。onはレベル2にし、offはレベル2を0にしますがレベル1は維持します。onとoffの両方に含まれるユーザーは変更しません。
        必要なrole権限: `edit_channel_subscription`。
    put:
      summary: チャンネルの通知購読者を設定
      responses:
        "204":
          description: |-
            No Content
            変更されました。
          headers: {}
        "400":
          description: Bad Request
        "403":
          description: |-
            Forbidden
            指定したチャンネルの通知購読者は変更できません。
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutChannelSubscribersRequest"
      description: |-
        指定したチャンネルの通知購読者を設定します。
        リクエストに含めなかったユーザーの通知購読状態はオフになります。
        また、存在しないユーザーを指定した場合は無視されます。
        EditChannelSubscription権限があれば全ユーザーの購読を変更できます。onを省略すると、現在レベル2の全員をレベル0にします。レベル1は維持します。
        必要なrole権限: `edit_channel_subscription`。
      tags:
        - channel
        - notification
      operationId: setChannelSubscribers
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
