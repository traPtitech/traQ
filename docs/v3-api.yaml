      summary: Webhookを削除
      responses:
        "204":
          description: |-
            No Content
            削除されました。
        "404":
          description: |-
            Not Found
            Webhookが見つかりません。
      tags:
        - webhook
      operationId: deleteWebhook
      security:
        - cookieAuth: []
        - OAuth2: ["manage_bot"]
      description: |-
        指定したWebhookを削除します。
        Webhookによって投稿されたメッセージは削除されません。
        対応するBotユーザーを無効化します。
        必要なrole権限: `delete_webhook`。
    patch:
      summary: Webhook情報を変更
      responses:
        "204":
          description: |-
            No Content
            編集できました。
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            Webhookが見つかりません。
      operationId: editWebhook
      security:
        - cookieAuth: []
        - OAuth2: ["manage_bot"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchWebhookRequest"
      tags:
        - webhook
      description: |-
        指定したWebhookの情報を変更します。
        descriptionの空文字は400、secretの空文字は署名不要を表します。ownerIdは有効な人間ユーザーに限り、譲渡後は旧所有者の所有権によるアクセスが失われます。
        必要なrole権限: `edit_webhook`。
