openapi: 3.0.0
info:
  title: traQ v3
  version: "3.0"
  description: |-
    traQ v3 API

    スタンプ・アイコン画像のアップロードはPNG/JPEG/GIFに対応し、SVGは受け付けません。サイズ上限はスタンプ1MiB、アイコン2MiBで、超過は400です。
    PNG/JPEGはPNGに変換し、GIFはアニメーションを保って、縦横比を維持したままスタンプ128×128・アイコン256×256以内に縮小します。
    入力画素数の上限はConfig.Imaging.MaxPixels（既定2560×1600）です。GIFはさらに1000フレーム以下、論理画面の画素数×フレーム数がMaxPixelsの16倍以下に制限されます。
    スタンプ・ユーザー・Bot・Webhookのアイコン画像GETはETag、Last-Modified、Rangeに対応し、条件に応じて304・206・416を返します。

    通常APIはr_session cookieまたはBearerトークンで認証します。空でないAuthorizationヘッダを優先し、不正でもcookieへフォールバックしません。
    各操作のsecurityは認証方式の選択肢です。OAuth2では列挙したscopeに加えて、ユーザーroleにも記載の権限が必要です。cookieはrole権限、Bot専用トークンはBotのscopeとrole権限で判定します。リソースの所有者・参加者などの条件は各操作の説明に従います。
    roleとscopeの権限はサーバー設定に依存し、ここでは組み込みの定義を記載しています。対応するOAuth scopeがない操作はcookie認証を使用します。client_credentialsではユーザーroleの代わりにClient roleを使用します。
    認証情報がない場合は401、凍結・無効ユーザーは403です。認証付きv3 APIはユーザーIDとIPの組ごとに毎秒100リクエスト・burst 1000に制限され、超過時は429です。
    Botは自身のQR・パスワード・FCM・閲覧状態・スター・未読・購読・セッション・トークン・外部連携・設定、およびパレット・Webhook管理・Client管理・クリップ・OGP・ユーザーWebSocket・OAuth同意の操作を利用できません。
    メッセージ投稿・編集と通常ファイルアップロードはContent-Lengthが必須で、chunkedなど未指定の場合は411です。メッセージのリクエスト本文は100KiB、ファイルアップロードの本文は30MiBを超えると413です。
    通常APIのエラーはmessageフィールド、OAuthのプロトコルエラーはerror・error_descriptionフィールドで返します。ネットワーク通信の失敗は502として返すことがあります。
    ETagを返す一覧GETはIf-None-Match一致時に304、If-Match不一致時に412を返します。prettyクエリを指定するとJSONを整形します。
    X-TRAQ-VERSIONはサーバーバージョン、X-Request-IDはリクエストIDです。ファイル系のX-TRAQ-FILE-TYPE・X-TRAQ-FILE-CACHEは各操作の説明を参照してください。
    CORSではIf-Match・If-None-Matchを送信でき、ETag・Last-Modified・Content-Range・Accept-RangesをJavaScriptから参照できます。gzipはサーバー設定に従い、Content-Security-Policyにはframe-ancestors 'none'を設定します。
  license:
    name: MIT
    url: "https://github.com/traPtitech/traQ/blob/master/LICENSE"
  contact:
    name: traP
    url: "https://github.com/traPtitech/traQ"
servers:
  - url: "https://q.trap.jp/api/v3"
    description: production
  - url: "https://q-dev.trapti.tech/api/v3"
    description: staging
  - url: "http://localhost:3000/api/v3"
    description: local
x-traq-codegen-schemas:
  description: HTTPエンドポイントから参照されていないが、クライアントがWebSocketイベントの型を生成するために使用するコンポーネント
  schemas:
    UserOfflineEvent:
      $ref: "#/components/schemas/UserOfflineEvent"
    QallRoomStateChangedEvent:
      $ref: "#/components/schemas/QallRoomStateChangedEvent"
    QallSoundboardItemCreatedEvent:
      $ref: "#/components/schemas/QallSoundboardItemCreatedEvent"
    QallSoundboardItemDeletedEvent:
      $ref: "#/components/schemas/QallSoundboardItemDeletedEvent"
paths:
  "/channels/{channelId}/messages":
    parameters:
      - $ref: "#/components/parameters/channelIdInPath"
    post:
      summary: チャンネルにメッセージを投稿
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      description: |-
        指定したチャンネルにメッセージを投稿します。
        embedをtrueに指定すると、メッセージ埋め込みが自動で行われます。
        アーカイブされているチャンネルに投稿することはできません。
        embedはリクエスト本文で指定します。クエリのembedは無視されます。
        投稿時に未読・最新メッセージ情報を更新し、購読・ユーザー/グループメンション・引用に応じて通知します。引用通知の有無はnotifyCitationに従います。
        必要なrole権限: `post_message`。
      operationId: postMessage
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
        description: ""
      tags:
        - message
        - channel
    get:
      summary: チャンネルメッセージのリストを取得
      description: |-
        指定したチャンネルのメッセージのリストを取得します。
        limitの省略時と0指定時は20件、負のoffsetは400です。orderは大小文字を問わずascのみ昇順で、それ以外は降順です。
        必要なrole権限: `get_message`。
      operationId: getMessages
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      tags:
        - channel
        - message
      parameters:
        - $ref: "#/components/parameters/limitInQuery"
        - $ref: "#/components/parameters/offsetInQuery"
        - $ref: "#/components/parameters/sinceInQuery"
        - $ref: "#/components/parameters/untilInQuery"
        - $ref: "#/components/parameters/inclusiveInQuery"
        - $ref: "#/components/parameters/orderInQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: メッセージの配列
                items:
                  $ref: "#/components/schemas/Message"
          headers:
            X-TRAQ-MORE:
              $ref: "#/components/headers/X-TRAQ-MORE"
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
  "/messages":
    get:
      summary: メッセージを検索
      description: |-
        メッセージを検索します。
        既定では公開チャンネルのみ検索します。inを指定すると自分が参加するDMも検索できますが、アクセスできないチャンネルは403です。
        必要なrole権限: `get_message`。
      operationId: searchMessages
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      tags:
        - message
      parameters:
        - schema:
            type: string
          in: query
          name: word
          description: |
            検索ワード
            Simple-Query-String-Syntaxをパースして検索します
          example: '"phrase match" +(foo | bar) -baz'
        - schema:
            type: string
            format: date-time
          in: query
          name: after
          description: 投稿日時が指定日時より後
          example: 2006-01-02T15:04:05Z
        - schema:
            type: string
            format: date-time
          in: query
          name: before
          description: 投稿日時が指定日時より前
          example: 2006-01-02T15:04:05Z
        - schema:
            type: string
            format: uuid
          in: query
          name: in
          description: メッセージが投稿されたチャンネル
        - schema:
            type: array
            items:
              type: string
              format: uuid
          in: query
          name: to
          description: メンションされたユーザー
        - schema:
            type: array
            items:
              type: string
              format: uuid
          in: query
          name: from
          description: メッセージを投稿したユーザー
        - schema:
            type: string
            format: uuid
          in: query
          name: citation
          description: 引用しているメッセージ
        - schema:
            type: boolean
          in: query
          name: bot
          description: メッセージを投稿したユーザーがBotかどうか
        - schema:
            type: boolean
          in: query
          name: hasURL
          description: メッセージがURLを含むか
        - schema:
            type: boolean
          in: query
          name: hasAttachments
          description: メッセージが添付ファイルを含むか
        - schema:
            type: boolean
          in: query
          name: hasImage
          description: メッセージが画像を含むか
        - schema:
            type: boolean
          in: query
          name: hasVideo
          description: メッセージが動画を含むか
        - schema:
            type: boolean
          in: query
          name: hasAudio
          description: メッセージが音声ファイルを含むか
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          description: |-
            検索結果から取得するメッセージの最大件数
            limitとoffsetの合計は10000以下である必要があります
        - schema:
            type: integer
            minimum: 0
            maximum: 9999
            default: 0
          in: query
          name: offset
          description: |-
            検索結果から取得するメッセージのオフセット
            limitとoffsetの合計は10000以下である必要があります (limitを省略した場合は20として計算されます)
        - in: query
          name: sort
          schema:
            type: string
            default: createdAt
            enum:
              - createdAt
              - "-createdAt"
              - updatedAt
              - "-updatedAt"
          description: "ソート順 (作成日時が新しい `createdAt`, 作成日時が古い `-createdAt`, 更新日時が新しい `updatedAt`, 更新日時が古い `-updatedAt`)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: MessageSearchResult
                type: object
                description: メッセージ検索結果
                properties:
                  totalHits:
                    type: integer
                    format: int64
                    description: 検索にヒットしたメッセージ件数
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                    description: 検索にヒットしたメッセージの配列
                required:
                  - totalHits
                  - hits
        "400":
          description: |-
            Bad Request
            limitとoffsetの合計が10000を超えている場合などに返されます。
        "503":
          description: search service is currently unavailable
  "/messages/{messageId}":
    parameters:
      - $ref: "#/components/parameters/messageIdInPath"
    get:
      summary: メッセージを取得
      tags:
        - message
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not Found
      operationId: getMessage
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したメッセージを取得します。
        必要なrole権限: `get_message`。
    put:
      summary: メッセージを編集
      responses:
        "204":
          description: |-
            No Content
            メッセージを編集できました。
        "400":
          description: Bad Request
        "403":
          description: |-
            Forbidden
            指定されたメッセージを編集する権限がありません。
        "404":
          description: Not Found
      description: |-
        指定したメッセージを編集します。
        自身が投稿したメッセージのみ編集することができます。
        アーカイブされているチャンネルのメッセージを編集することは出来ません。
        embedはリクエスト本文で指定します。クエリのembedは無視されます。
        必要なrole権限: `edit_message`。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMessageRequest"
      tags:
        - message
      operationId: editMessage
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
    delete:
      summary: メッセージを削除
      responses:
        "204":
          description: |-
            No Content
            正常に削除できました。
        "403":
          description: |-
            Forbidden
            指定されたメッセージを削除する権限がありません。
        "404":
          description: Not Found
      tags:
        - message
      operationId: deleteMessage
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      description: |-
        指定したメッセージを削除します。
        自身が投稿したメッセージと自身が管理権限を持つWebhookとBOTが投稿したメッセージのみ削除することができます。
        アーカイブされているチャンネルのメッセージは削除できず、400を返します。
        関連するピン留め・未読・クリップも削除します。
        必要なrole権限: `delete_message`。
  "/messages/{messageId}/pin":
    parameters:
      - $ref: "#/components/parameters/messageIdInPath"
    get:
      summary: ピン留めを取得
      tags:
        - message
        - pin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePin"
        "404":
          description: |-
            Not Found
            指定したメッセージ、またはピン留めが見つかりません。
      operationId: getPin
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したメッセージのピン留め情報を取得します。
        必要なrole権限: `get_message`。
    post:
      summary: ピン留めする
      responses:
        "201":
          description: |-
            Created
            指定したメッセージがピン留めされました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePin"
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            メッセージが見つかりません。
      tags:
        - message
        - pin
      operationId: createPin
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      description: |-
        指定したメッセージをピン留めします。
        アーカイブされているチャンネルのメッセージ・存在しないメッセージ・チャンネル当たりの上限数を超えたメッセージのピン留めはできません。
        上限は1チャンネル100件です。重複と上限超過は400を返し、成功時はPinAddedチャンネルイベントを記録します。
        必要なrole権限: `create_message_pin`。
    delete:
      summary: ピン留めを外す
      responses:
        "204":
          description: |-
            No Content
            指定したメッセージのピン留めが外されました。
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            指定したメッセージ、またはピン留めが見つかりません。
      description: |-
        指定したメッセージのピン留めを外します。
        必要なrole権限: `delete_message_pin`。
      tags:
        - message
        - pin
      operationId: removePin
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
  "/channels/{channelId}/stats":
    parameters:
      - $ref: "#/components/parameters/channelIdInPath"
      - $ref: "#/components/parameters/excludeDeletedMessagesInQuery"
    get:
      summary: チャンネル統計情報を取得
      tags:
        - channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelStats"
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      operationId: getChannelStats
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
      description: |-
        指定したチャンネルの統計情報を取得します。
        必要なrole権限: `get_channel`。
  "/channels/{channelId}/topic":
    parameters:
      - $ref: "#/components/parameters/channelIdInPath"
    get:
      summary: チャンネルトピックを取得
      tags:
        - channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTopic"
        "400":
          description: |-
            Bad Request
            Publicチャンネルではありません。
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      operationId: getChannelTopic
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
      description: |-
        指定したチャンネルのトピックを取得します。
        必要なrole権限: `get_channel`。
    put:
      summary: チャンネルトピックを編集
      responses:
        "204":
          description: |-
            No Content
            チャンネルトピックが編集されました
        "400":
          description: Bad Request
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      tags:
        - channel
      description: |-
        指定したチャンネルのトピックを編集します。
        アーカイブされているチャンネルのトピックは編集できません。
        同じtopicの再設定は、アーカイブ済みでも204を返します。
        必要なrole権限: `edit_channel_topic`。
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutChannelTopicRequest"
      operationId: editChannelTopic
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
  "/channels/{channelId}/viewers":
    parameters:
      - $ref: "#/components/parameters/channelIdInPath"
    get:
      summary: チャンネル閲覧者リストを取得
      tags:
        - channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: チャンネル閲覧者の配列
                items:
                  $ref: "#/components/schemas/ChannelViewer"
        "404":
          description: |-
            Not Found
            チャンネルが見つかりません。
      operationId: getChannelViewers
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
      description: |-
        指定したチャンネルの閲覧者のリストを取得します。
        必要なrole権限: `get_channel`。
  /files:
    post:
      summary: ファイルをアップロード
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        "400":
          description: Bad Request
        "411":
          description: Length Required
        "413":
          description: Request Entity Too Large
      tags:
        - file
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PostFileRequest"
      operationId: postFile
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      description: |-
        指定したチャンネルにファイルをアップロードします。
        アーカイブされているチャンネルにはアップロード出来ません。
        multipart本文の上限は30MiBです。MIMEタイプはアップロード時の申告値を使用します。
        画像サムネイルはJPEG/PNG/GIF/WebP、波形はaudio/mpeg・audio/mp3・audio/wav・audio/x-wavの場合に生成します。
        DMへのアップロードは参加者のみアクセス可能にします。
        必要なrole権限: `upload_file`。
    get:
      summary: ファイルメタのリストを取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: ファイルメタの配列
                items:
                  $ref: "#/components/schemas/FileInfo"
          headers:
            X-TRAQ-MORE:
              $ref: "#/components/headers/X-TRAQ-MORE"
        "400":
          description: Bad Request
      tags:
        - file
      operationId: getFiles
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: channelId
          description: アップロード先チャンネルUUID
        - $ref: "#/components/parameters/limitInQuery"
        - $ref: "#/components/parameters/offsetInQuery"
        - $ref: "#/components/parameters/sinceInQuery"
        - $ref: "#/components/parameters/untilInQuery"
        - $ref: "#/components/parameters/inclusiveInQuery"
        - $ref: "#/components/parameters/orderInQuery"
        - schema:
            type: boolean
            default: false
          in: query
          name: mine
          description: アップロード者が自分のファイルのみを取得するか
      description: |-
        指定したクエリでファイルメタのリストを取得します。
        クエリパラメータ`channelId`, `mine`の少なくともいずれかが必須です。
        通常のユーザーファイルのみを返します。limitの省略時と0指定時は20件、負のoffsetは400、orderは大小文字を問わずascのみ昇順で、それ以外は降順です。
        channelIdのnil UUIDは未指定扱いです。存在しない、またはアクセスできないチャンネルの指定は400を返します。
        必要なrole権限: `download_file`。
  "/files/{fileId}/meta":
    parameters:
      - $ref: "#/components/parameters/fileIdInPath"
    get:
      summary: ファイルメタを取得
      tags:
        - file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        "403":
          description: Forbidden
        "404":
          description: |-
            Not Found
            ファイルが見つかりません。
      operationId: getFileMeta
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したファイルのメタ情報を取得します。
        指定したファイルへのアクセス権限が必要です。
        Cache-Controlはprivate, max-age=86400です。
        必要なrole権限: `download_file`。
  "/files/{fileId}/thumbnail":
    parameters:
      - $ref: "#/components/parameters/fileIdInPath"
      - schema:
          $ref: "#/components/schemas/ThumbnailType"
        in: query
        name: type
        description: 取得するサムネイルのタイプ
    get:
      summary: サムネイル画像を取得
      tags:
        - file
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
        "400":
          description: サムネイルのtypeが不正
        "403":
          description: Forbidden
        "404":
          description: |-
            Not Found
            ファイルが見つからない、またはサムネイル画像が存在しません。
      operationId: getThumbnailImage
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したファイルのサムネイル画像を取得します。
        指定したファイルへのアクセス権限が必要です。
        typeは大小文字を区別せず、不正値は400です。Cache-Controlはprivate, max-age=31536000、X-TRAQ-FILE-TYPEは元ファイルの種別、X-TRAQ-FILE-CACHEはtrueです。
        必要なrole権限: `download_file`。
  "/files/{fileId}":
    parameters:
      - $ref: "#/components/parameters/fileIdInPath"
    get:
      summary: ファイルをダウンロード
      tags:
        - file
      responses:
        "200":
          description: |-
            OK
            ファイル本体を返します。
            application/octet-streamで返すことになっていますが、ファイルの形式によって変わります。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "https://developer.mozilla.org/ja/docs/Web/HTTP/Headers/Content-Disposition"
        "206":
          description: Partial Content
        "302":
          description: 署名URLへのリダイレクト
        "304":
          description: Not Modified
        "416":
          description: Range Not Satisfiable
        "403":
          description: Forbidden
        "404":
          description: Not Found
      parameters:
        - schema:
            type: integer
          in: query
          name: dl
          deprecated: true
          description: このクエリパラメータは廃止されており、意味を持ちません（現在、このパラメータが0の場合も1の場合もレスポンスにはContent-Dispositionヘッダーが付与されます）
      operationId: getFile
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      description: |-
        指定したファイル本体を取得します。
        指定したファイルへのアクセス権限が必要です。
        DMの通常ファイルは非参加者に403を返します。アイコン・スタンプにはこのアクセス制限を適用しません。
        S3/Swiftで直接アクセスURLを発行できる場合は、有効期間5分の署名URLへ302でリダイレクトします。
        直接配信ではETag・Last-Modified・Rangeに対応し、条件に応じて304・206・416を返します。Cache-Controlはprivate, max-age=31536000です。
        直接配信のX-TRAQ-FILE-TYPEはファイル種別を表し、アイコン・スタンプにはX-TRAQ-FILE-CACHE: trueも付与します。
        必要なrole権限: `download_file`。
    delete:
      summary: ファイルを削除
      responses:
        "204":
          description: |-
            No Content
            ファイルが削除できました。
        "403":
          description: Forbidden
        "404":
          description: Not Found
      tags:
        - file
      operationId: deleteFile
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
        - bearerAuth: []
      description: |-
        指定したファイルを削除します。
        指定したファイルの削除権限が必要です。
        アップロード本人の通常ファイルのみ削除できます。アイコン・スタンプ・soundboardは403を返します。
        必要なrole権限: `delete_file`。
