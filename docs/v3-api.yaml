      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      description: |-
        指定したユーザーにダイレクトメッセージを送信します。
        embedはリクエスト本文で指定します。クエリのembedは無視されます。
        自分自身・Bot・Webhookユーザーにも送信できます。
        投稿時に未読・最新メッセージ情報を更新し、購読・ユーザー/グループメンション・引用に応じて通知します。引用通知の有無はnotifyCitationに従います。
        必要なrole権限: `post_message`。
    get:
      summary: ダイレクトメッセージのリストを取得
      operationId: getDirectMessages
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - bearerAuth: []
      tags:
        - message
        - user
      responses:
        "200":
          description: OK
          headers:
            X-TRAQ-MORE:
              $ref: "#/components/headers/X-TRAQ-MORE"
          content:
            application/json:
              schema:
                type: array
