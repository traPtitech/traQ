      responses:
        "204":
          description: |-
            No Content
            紐付けを解除しました。
        "400":
          description: Bad Request
      description: |-
        自分に紐付けられている外部ログインアカウントの紐付けを解除します。
        未連携のproviderNameは400を返します。
        必要なrole権限: `edit_my_external_account`。
      tags:
        - authentication
        - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUnlinkExternalAccount"
  "/users/{userId}/dm-channel":
    parameters:
      - schema:
          type: string
          format: uuid
        name: userId
        in: path
        required: true
    get:
      summary: DMチャンネル情報を取得
      tags:
        - user
        - channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DMChannel"
        "404":
          description: |
            Not Found
            ユーザーが見つかりません。
      operationId: getUserDMChannel
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
      description: |-
        指定したユーザーとのダイレクトメッセージチャンネルの情報を返します。
        ダイレクトメッセージチャンネルが存在しなかった場合、自動的に作成されます。
        DMチャンネルが未作成の場合は作成し、CHANNEL_CREATEDイベントを配信します。
        必要なrole権限: `get_channel`。
  "/messages/{messageId}/clips":
    parameters:
      - $ref: "#/components/parameters/messageIdInPath"
    get:
      summary: 自分のクリップを取得
      tags:
        - message
        - clip
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageClip"
        "404":
          description: |
            Not Found
      operationId: getMessageClips
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
      description: |-
        対象のメッセージの自分のクリップの一覧を返します。
        必要なrole権限: `get_clip_folder`。
  /ogp:
    get:
      summary: OGP情報を取得
      tags:
        - ogp
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ogp"
        "400":
          description: 指定したURLが不正です。
      operationId: getOgp
      security:
        - cookieAuth: []
        - OAuth2: []
      description: |
        指定されたURLのOGP情報を取得します。
        指定されたURLに対するOGP情報が見つからなかった場合、typeがemptyに設定された空のOGP情報を返します。
      parameters:
        - schema:
            type: string
          in: query
          required: true
          name: url
          description: OGPを取得したいURL
  /ogp/cache:
    delete:
      summary: OGP情報のキャッシュを削除
      tags:
        - ogp
      responses:
        "204":
          description: No Content
        "400":
          description: 指定したURLが不正です。
      operationId: deleteOgpCache
      security:
        - cookieAuth: []
        - OAuth2: []
      description: 指定されたURLのOGP情報のキャッシュを削除します。
      parameters:
        - schema:
            type: string
          in: query
          required: true
          name: url
          description: OGPのキャッシュを削除したいURL
  /users/me/settings:
    get:
      summary: ユーザー設定を取得
      description: |-
        ユーザー設定を取得します。
        必要なrole権限: `get_me`。
      operationId: getUserSettings
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
      tags:
        - me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
  /users/me/settings/notify-citation:
    get:
      summary: メッセージ引用通知の設定情報を取得
      description: |-
        メッセージ引用通知の設定情報を取得します。
        設定未作成の場合はfalseを返します。
        必要なrole権限: `get_me`。
      operationId: getMyNotifyCitation
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
      tags:
        - me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNotifyCitation"
    put:
      summary: メッセージ引用通知の設定情報を変更
      responses:
        "204":
          description: 変更できました。
        "400":
          description: Bad Request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutNotifyCitationRequest"
        description: ""
      tags:
        - me
      operationId: changeMyNotifyCitation
      security:
        - cookieAuth: []
        - OAuth2: ["write"]
      description: |-
        メッセージ引用通知の設定情報を変更します
        必要なrole権限: `edit_me`。
  "/channels/{channelId}/path":
    parameters:
      - $ref: "#/components/parameters/channelIdInPath"
    get:
      summary: 指定したチャンネルパスを取得
      description: |-
        指定されたチャンネルのパスを取得します。
        必要なrole権限: `get_channel`。
      tags:
        - channel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPath"
        "404":
          description: Not Found
      operationId: getChannelPath
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
  /qall/endpoints:
    get:
      summary: LiveKitエンドポイントを取得
      description: |-
        接続可能なLiveKitエンドポイントを取得します。
        未設定時はendpointに空文字を返します。Qallの通常APIにはWebRTC権限が必要で、Bearer認証ではqallスコープも必要です。
        必要なrole権限: `web_rtc`。
      operationId: getQallEndpoints
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      responses:
        "200":
          description: 成功 - LiveKitエンドポイントの取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qallEndpointResponse"
        "500":
          description: Internal Server Error
  /qall/token:
    get:
      summary: LiveKitトークンを取得
      description: |-
        指定したルームに参加するためのLiveKitトークンを取得します。
        発行先は公開チャンネルに限り、不存在・非公開チャンネルは404です。isWebinarは文字列trueの場合だけ有効です。
        トークンの有効期間は24時間で、自分のmetadata更新を許可します。参加者のNameにはユーザーUUIDを設定します。
        必要なrole権限: `web_rtc`。
      operationId: getLiveKitToken
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      parameters:
        - $ref: "#/components/parameters/roomIdInQuery"
        - $ref: "#/components/parameters/isWebinarInQuery"
      responses:
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "200":
          description: 成功 - LiveKitトークンを返します
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qallTokenResponse"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
  /qall/rooms:
    get:
      summary: ルームと参加者の一覧を取得
      description: |-
        現在存在する(またはアクティブな)ルームと、そのルームに所属している参加者情報を取得します。
        必要なrole権限: `web_rtc`。
      operationId: getRooms
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      responses:
        "200":
          description: 成功 - ルームと参加者一覧の取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qallRoomsListResponse"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
  /qall/rooms/{roomId}/metadata:
    get:
      summary: ルームのメタデータを取得
      description: >
        ルームのメタデータを取得します。
      operationId: getRoomMetadata
      tags:
        - qall
      parameters:
        - $ref: "#/components/parameters/roomIdInPath"
      responses:
        "200":
          description: 成功 - ルームのメタデータを取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qallMetadataResponse"
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
    patch:
      summary: ルームのメタデータを更新
      description: |-
        ルームのメタデータを更新します。
        必要なrole権限: `web_rtc`。
      operationId: updateRoomMetadata
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      parameters:
        - $ref: "#/components/parameters/roomIdInPath"
      requestBody:
        description: ルームのメタデータ
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/qallMetadataRequest"
      responses:
        "200":
          description: 成功 - ルームのメタデータを更新
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
  /qall/rooms/{roomId}/participants:
    patch:
      summary: ルームでの発言権限を変更
      description: |-
        ルーム内の参加者の発言権限を変更します。
        ルームが存在しなければ404、自分が未参加またはCanPublishを持たなければ403です。
        必要なrole権限: `web_rtc`。
      operationId: changeParticipantRole
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      parameters:
        - $ref: "#/components/parameters/roomIdInPath"
      requestBody:
        description: 発言権限を変更する参加者の情報
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/qallParticipantRequest"
      responses:
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "200":
          description: 成功 - 発言権限を変更（部分的成功含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qallParticipantResponse"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
  /qall/webhook:
    post:
      summary: LiveKit Webhook受信
      description: |-
        LiveKit側で設定したWebhookから呼び出されるエンドポイントです。  
        参加者の入室・退出などのイベントを受け取り、サーバ内で処理を行います。
        AuthorizationのJWTと本文のSHA256で認証し、不正な場合は400を返します。未処理のイベントも200で受理します。
      operationId: liveKitWebhook
      security:
        - liveKitSignature: []
      tags:
        - qall
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              type: object
              description: LiveKit Webhook イベントのペイロード
      responses:
        "200":
          description: Webhookを正常に受信
        "400":
          description: Invalid payload
        "500":
          description: Internal Server Error
  /qall/soundboard:
    get:
      summary: サウンドボード用の音声一覧を取得
      description: |-
        DBに保存されたサウンドボード情報を取得します。  
        各アイテムには soundId, soundName, stampId が含まれます。
        必要なrole権限: `web_rtc`。
      operationId: getSoundboardList
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      responses:
        "200":
          description: サウンド一覧の取得に成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/soundboardListResponse"
        "500":
          description: サーバエラー

    post:
      summary: サウンドボード用の短い音声ファイルをアップロード
      description: |-
        15秒程度の短い音声ファイルを multipart/form-data で送信し、S3(互換ストレージ)にアップロードします。  
        クライアントは「soundName」というフィールドを送信し、それをDBに保存して関連付けを行います。  
        また、サーバ側で soundId を自動生成し、S3のファイル名に使用します。
        必要なrole権限: `web_rtc`。
      operationId: postSoundboard
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/soundboardUploadRequest"
      responses:
        "200":
          description: アップロード成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/soundboardUploadResponse"
        "400":
          description: ファイルが提供されていない等
        "500":
          description: アップロードエラーなどのサーバエラー

  /qall/soundboard/play:
    post:
      summary: アップロード済み音声を LiveKit ルームで再生
      description: |-
        S3上にある音声ファイルの署名付きURLを生成し、  
        Ingressを介して指定ルームに音声を流します。    
        該当ルームに参加しているユーザであれば再生可能とします。
        ルームが存在しなければ404、自分が未参加なら403です。
        必要なrole権限: `web_rtc`。
      operationId: postSoundboardPlay
      security:
        - cookieAuth: []
        - OAuth2: ["qall"]
        - bearerAuth: []
      tags:
        - qall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/soundboardPlayRequest"
      responses:
        "403":
          description: Forbidden
        "404":
          description: Not Found
        "200":
          description: Ingressの作成に成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/soundboardPlayResponse"
        "400":
          description: パラメータ不足 or ユーザが部屋にいない等
        "401":
          description: 認証エラー
        "500":
          description: Ingress作成失敗などのサーバエラー

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: r_session
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /api/v3/oauth2/authorize
          tokenUrl: /api/v3/oauth2/token
          scopes:
            read: 読み取りスコープ
            write: 書き込みスコープ
            manage_bot: bot関連読み書きスコープ
            qall: Qall利用スコープ
            openid: OpenID Connect・基本userinfo
            profile: 追加プロフィール情報
    bearerAuth:
      type: http
      scheme: bearer
      description: Bot作成・トークン再発行で得たBot専用アクセストークン。
    clientBasicAuth:
      type: http
      scheme: basic
      description: OAuthクライアントIDとsecret。フォーム認証の条件はtoken endpointを参照。
    webhookSignature:
      type: apiKey
      in: header
      name: X-TRAQ-Signature
      description: Webhook secretによる本文のHMAC-SHA1（16進数）。secretが空なら不要。
    liveKitSignature:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKitが発行する、本文のSHA-256を含む署名付きJWT。
  schemas:
    Message:
      title: Message
      type: object
      description: メッセージ
      properties:
        id:
          type: string
          format: uuid
          description: メッセージUUID
        userId:
          type: string
          description: 投稿者UUID
          format: uuid
        channelId:
          type: string
          description: チャンネルUUID
          format: uuid
        content:
          type: string
          description: メッセージ本文
        createdAt:
          type: string
          format: date-time
          description: 投稿日時
        updatedAt:
          type: string
          format: date-time
          description: 編集日時
        pinned:
          description: ピン留めされているかどうか
          type: boolean
        stamps:
          type: array
          description: 押されているスタンプの配列
          items:
            $ref: "#/components/schemas/MessageStamp"
        threadId:
          type: string
          format: uuid
          description: スレッドUUID
          nullable: true
        nonce:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,32}$"
          description: メッセージ送信の確認に使うことができる任意の識別子(投稿でのみ使用可)
      required:
        - id
        - userId
        - channelId
        - content
        - createdAt
        - updatedAt
        - pinned
        - stamps
        - threadId
    MessageStamp:
      title: MessageStamp
      type: object
      description: メッセージに押されたスタンプ
      properties:
        userId:
          type: string
          format: uuid
          description: ユーザーUUID
        stampId:
          type: string
          format: uuid
          description: スタンプUUID
        count:
          type: integer
          description: スタンプ数
          format: int32
        createdAt:
          type: string
          description: スタンプが最初に押された日時
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: スタンプが最後に押された日時
      required:
        - userId
        - stampId
        - count
        - createdAt
        - updatedAt
    StampStats:
      title: StampStats
      type: object
      description: スタンプ統計情報
      properties:
        count:
          type: integer
          format: int64
          description: スタンプ使用総数(同じユーザによって同じメッセージに貼られたものは複数カウントしない)
        totalCount:
          type: integer
          format: int64
          description: スタンプ使用総数(全てカウント)
      required:
        - count
        - totalCount
    Pin:
      title: Pin
      type: object
      description: ピン情報(メッセージ本体付き)
      properties:
        userId:
          type: string
          format: uuid
          description: ピン留めしたユーザーUUID
        pinnedAt:
          type: string
          format: date-time
          description: ピン留めされた日時
        message:
          $ref: "#/components/schemas/Message"
      required:
        - userId
        - pinnedAt
        - message
    Channel:
      title: Channel
      type: object
      description: チャンネル
      properties:
        id:
          type: string
          description: チャンネルUUID
          format: uuid
        parentId:
          type: string
          format: uuid
          description: 親チャンネルUUID
          nullable: true
        archived:
          type: boolean
          description: チャンネルがアーカイブされているかどうか
        force:
          type: boolean
          description: 強制通知チャンネルかどうか
        topic:
          type: string
          description: チャンネルトピック
        name:
          type: string
          description: チャンネル名
          pattern: "^[a-zA-Z0-9-_]{1,20}$"
        children:
          type: array
          description: 子チャンネルのUUID配列
          items:
            type: string
            format: uuid
      required:
        - id
        - parentId
        - archived
        - force
        - topic
        - name
        - children
    PutMessageRequest:
      title: PutMessageRequest
      type: object
      description: メッセージ編集リクエスト。nonceは無視されます。
      properties:
        content:
          type: string
          description: メッセージ本文
          minLength: 1
          maxLength: 10000
        embed:
          type: boolean
          default: false
          description: メンション・チャンネルリンクを自動埋め込みするか
      required:
        - content
    PostMessageRequest:
      title: PostMessageRequest
      type: object
      description: メッセージ投稿リクエスト
      properties:
        content:
          type: string
          description: メッセージ本文
          minLength: 1
          maxLength: 10000
        embed:
          type: boolean
          default: false
          description: メンション・チャンネルリンクを自動埋め込みするか
        nonce:
          type: string
          pattern: "^[a-zA-Z0-9_-]{1,32}$"
          description: メッセージ送信の確認に使うことができる任意の識別子(投稿でのみ使用可)
      required:
        - content
    ChannelStats:
      title: ChannelStats
      type: object
      description: チャンネル統計情報
      properties:
        totalMessageCount:
          type: integer
          format: int64
          description: チャンネルの総投稿メッセージ数(削除されたものも含む)
        stamps:
          type: array
          description: チャンネル上のスタンプ統計情報
          items:
            $ref: "#/components/schemas/ChannelStatsStamp"
        users:
          type: array
          description: チャンネル上のユーザー統計情報
          items:
            $ref: "#/components/schemas/ChannelStatsUser"
        datetime:
          type: string
          format: date-time
          description: 統計情報日時
      required:
        - totalMessageCount
        - stamps
        - users
        - datetime
    ChannelStatsStamp:
      title: ChannelStatsStamp
      type: object
      description: チャンネル上の特定スタンプ統計情報
      properties:
        id:
          type: string
          format: uuid
          description: スタンプID
        count:
          type: integer
          format: int64
          description: スタンプ数(同一メッセージ上のものは複数カウントしない)
        total:
          type: integer
          format: int64
          description: スタンプ数(同一メッセージ上のものも複数カウントする)
      required:
        - id
        - count
        - total
    ChannelStatsUser:
      title: ChannelStatsUser
      type: object
      description: チャンネル上の特定ユーザー統計情報
      properties:
        id:
          type: string
          format: uuid
          description: ユーザーID
        messageCount:
          type: integer
          format: int64
          description: メッセージ数
      required:
        - id
        - messageCount
    ChannelTopic:
      title: ChannelTopic
      type: object
      description: チャンネルトピック
      properties:
        topic:
          type: string
          description: トピック
      required:
        - topic
    PutChannelTopicRequest:
      title: PutChannelTopicRequest
      type: object
      description: チャンネルトピック編集リクエスト
      properties:
        topic:
