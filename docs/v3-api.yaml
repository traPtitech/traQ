      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
      operationId: getPublicUserIcon
      security: []
      description: |-
        ユーザーのアイコン画像を取得します。
        Bot・Webhook・凍結ユーザーも対象です。ユーザーまたは画像メタが存在しない場合は404、Cache-Controlはpublic, max-age=3600です。
  "/clients/{clientId}":
    parameters:
      - $ref: "#/components/parameters/clientIdInPath"
    get:
      summary: OAuth2クライアント情報を取得
      tags:
        - oauth2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OAuth2Client"
                  - $ref: "#/components/schemas/OAuth2ClientDetail"
        "403":
          description: Forbidden
        "404":
          description: Not Found
      operationId: getClient
      security:
        - cookieAuth: []
        - OAuth2: ["manage_bot"]
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: detail
          description: 詳細情報を含めるかどうか
      description: |-
        指定したOAuth2クライアントの情報を取得します。
        詳細情報の取得には対象のクライアントの管理権限が必要です。
        必要なrole権限: `get_clients`。
    delete:
      summary: OAuth2クライアントを削除
      responses:
        "204":
          description: |-
            No Content
            削除されました。
        "403":
          description: Forbidden
        "404":
          description: |-
            Not Found
            OAuth2クライアントが見つかりません。
      description: |-
        指定したOAuth2クライアントを削除します。
        対象のクライアントの管理権限が必要です。正常に削除された場合、このクライアントに対する認可は全て取り消されます。
        必要なrole権限: `delete_my_client`。
      operationId: deleteClient
      security:
        - cookieAuth: []
        - OAuth2: ["manage_bot"]
      tags:
        - oauth2
    patch:
      summary: OAuth2クライアント情報を変更
      responses:
        "204":
          description: |-
            No Content
            変更できました。
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "404":
          description: |-
            Not Found
            OAuth2クライアントが見つかりません。
      tags:
        - oauth2
      operationId: editClient
      security:
        - cookieAuth: []
        - OAuth2: ["manage_bot"]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClientRequest"
        description: ""
      description: |-
        指定したOAuth2クライアントの情報を変更します。
        対象のクライアントの管理権限が必要です。
        クライアント開発者UUIDを変更した場合は、変更先ユーザーにクライアント管理権限が移譲され、自分自身は権限を失います。
        descriptionの空文字は400を返します。
        必要なrole権限: `edit_my_client`。
  "/clients/{clientId}/tokens":
    delete:
      summary: OAuthクライアントのトークンを削除
      parameters:
        - $ref: "#/components/parameters/clientIdInPath"
      responses:
        "204":
          description: |-
            No Content
            削除できました。
        "404":
          description: |-
            Not Found
            OAuth2クライアントが見つかりません。
      tags:
        - oauth2
      operationId: revokeClientTokens
      security:
        - cookieAuth: []
      description: |-
        自分が許可している指定したOAuthクライアントのアクセストークンを全てRevokeします。
        必要なrole権限: `revoke_my_token`。
  /clients:
    get:
