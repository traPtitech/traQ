  "/webhooks/{webhookId}":
    parameters:
      - $ref: "#/components/parameters/webhookIdInPath"
    get:
      summary: Webhook情報を取得
      tags:
        - webhook
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          description: |-
            Not Found
            Webhookが見つかりません。
      operationId: getWebhook
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
      description: |-
        指定したWebhookの詳細を取得します。
        必要なrole権限: `get_webhook`。
    post:
      summary: Webhookを送信
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
      operationId: postWebhook
      security:
        - webhookSignature: []
        - {}
      parameters:
        - schema:
            type: string
          in: header
          name: X-TRAQ-Signature
          description: リクエストボディシグネチャ(Secretが設定されている場合は必須)
        - schema:
            type: string
          in: header
          name: X-TRAQ-Channel-Id
          description: 投稿先のチャンネルID(変更する場合)
        - schema:
            type: boolean
            default: false
          in: query
          name: embed
          description: 1・t・T・true・TRUE・Trueをtrueとして解釈し、それ以外はfalseとして扱います。
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              description: メッセージ文字列
        description: ""
      tags:
        - webhook
      description: |-
        Webhookにメッセージを投稿します。
        secureなウェブフックに対しては`X-TRAQ-Signature`ヘッダーが必須です。
        アーカイブされているチャンネルには投稿できません。
        Content-Typeはtext/plainまたはtext/plain; charset=utf-8との大小文字を無視した完全一致のみ受け付け、それ以外は415です。
        署名は本文のHMAC-SHA1をhex化した値です。hexの復号結果が空の場合は署名未指定として400、不一致も400です。
        X-TRAQ-Channel-Idで任意の公開チャンネルに投稿先を変更できます。不正・非公開・不存在IDは400です。
