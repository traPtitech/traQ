    get:
      summary: ユーザーのリストを取得
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: ユーザー情報の配列
                items:
                  $ref: "#/components/schemas/User"
        "400":
          description: Bad Request
      operationId: getUsers
      security:
        - cookieAuth: []
        - OAuth2: ["read"]
        - OAuth2: ["manage_bot"]
        - bearerAuth: []
      tags:
        - user
