      type: array
      items:
        $ref: "#/components/schemas/qallRoomWithParticipants"
    qallTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: LiveKit用のJWTトークン
      required:
        - token
    qallRoomWithParticipants:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
          description: ルームのID
        participants:
          type: array
          items:
            $ref: "#/components/schemas/qallParticipant"
        isWebinar:
          type: boolean
          description: ウェビナールームかどうか
        metadata:
          type: string
          description: ルームに関連付けられたカスタム属性
      required:
        - roomId
        - participants
    qallParticipant:
      description: ルーム内の参加者一覧
      type: object
      properties:
        identity:
          type: string
          description: ユーザーID_RandomUUID
        name:
          type: string
          description: 表示名
        joinedAt:
          type: string
          format: date-time
          description: 参加した時刻
        attributes:
          type: object
          additionalProperties:
            type: string
          description: ユーザーに関連付けられたカスタム属性
        canPublish:
          type: boolean
          description: 発言権限
    qallParticipantRequest:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                description: ユーザーID
              canPublish:
                type: boolean
                description: 発言権限
      required:
        - users
    qallMetadataRequest:
      type: object
      properties:
        metadata:
          type: string
          description: ルームに関連付けられたカスタム属性
    qallMetadataResponse:
      type: object
      properties:
        metadata:
          type: string
          description: ルームに関連付けられたカスタム属性
    qallParticipantResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              participantId:
                type: string
                description: 対象参加者ID
              status:
                type: string
                description: "success もしくは error"
              errorMessage:
                type: string
                description: エラーがある場合の詳細
      example:
        results:
          - participantId: "user1"
            status: "success"
          - participantId: "user2"
            status: "error"
            errorMessage: "Invalid participant ID"
    soundboardUploadRequest:
      type: object
      properties:
        audio:
          type: string
          format: binary
          description: アップロードする音声ファイル(20秒以内)
        soundName:
          type: string
          description: ユーザが自由につけるサウンド名
        stampId:
          type: string
          description: アイコンスタンプID
      required:
        - audio
        - soundName
    soundboardPlayRequest:
      type: object
      properties:
        soundId:
          type: string
          description: サウンドID (DB登録済み)
        roomName:
          type: string
          format: uuid
          description: 再生させたいルームのUUID
      required:
        - soundId
        - roomName
  headers:
    X-TRAQ-MORE:
      schema:
        type: boolean
      description: 指定した範囲に要素がさらに存在するかどうか
  parameters:
    paletteIdInPath:
      name: paletteId
      in: path
      required: true
      description: スタンプパレットUUID
      schema:
        type: string
        format: uuid
    folderIdInPath:
      name: folderId
      in: path
      required: true
      description: クリップフォルダUUID
      schema:
        type: string
        format: uuid
    botIdInPath:
      name: botId
      in: path
      required: true
      description: BOTUUID
      schema:
        type: string
        format: uuid
    clientIdInPath:
      name: clientId
      in: path
      required: true
      description: OAuth2クライアントID（36文字の英数字）
      schema:
        type: string
    tokenIdInPath:
      name: tokenId
      in: path
      required: true
      description: OAuth2トークンUUID
      schema:
        type: string
        format: uuid
    sessionIdInPath:
      name: sessionId
      in: path
      required: true
      description: セッションUUID
      schema:
        type: string
        format: uuid
    redirectInQuery:
      schema:
        type: string
        format: uri
      description: リダイレクト先
      name: redirect
      in: query
    tagIdInPath:
      name: tagId
      in: path
      required: true
      description: タグUUID
      schema:
        type: string
        format: uuid
    webhookIdInPath:
      name: webhookId
      in: path
      required: true
      description: WebhookUUID
      schema:
        type: string
        format: uuid
    groupIdInPath:
      name: groupId
      in: path
      required: true
      description: ユーザーグループUUID
      schema:
        type: string
        format: uuid
    userIdInPath:
      name: userId
      in: path
      required: true
      description: ユーザーUUID
      schema:
        type: string
        format: uuid
    stampIdInPath:
      name: stampId
      in: path
      required: true
      description: スタンプUUID
      schema:
        type: string
        format: uuid
    fileIdInPath:
      name: fileId
      in: path
      required: true
      description: ファイルUUID
      schema:
        type: string
        format: uuid
    messageIdInPath:
      name: messageId
      in: path
      required: true
      description: メッセージUUID
      schema:
        type: string
        format: uuid
    limitInQuery:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 0
        maximum: 200
        default: 20
      description: 取得する件数。0も既定の20件として扱います。
      example: 50
    offsetInQuery:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      description: 取得するオフセット
      example: 150
    sinceInQuery:
      in: query
      name: since
      schema:
        type: string
        format: date-time
        default: "0000-01-01T00:00:00.000000Z"
      description: 取得する時間範囲の開始日時
      example: "2016-10-12T11:00:00.000000Z"
    untilInQuery:
      in: query
      name: until
      schema:
        type: string
        format: date-time
      description: 取得する時間範囲の終了日時
      example: "2016-10-12T11:00:00.0000000Z"
    inclusiveInQuery:
      in: query
      name: inclusive
      schema:
        type: boolean
        default: false
      description: 範囲の端を含めるかどうか
    orderInQuery:
      in: query
      name: order
      schema:
        type: string
        default: desc
      description: 大小文字を問わずascなら昇順、それ以外は降順。
    channelIdInPath:
      name: channelId
      in: path
      required: true
      description: チャンネルUUID
      schema:
        type: string
        format: uuid
    roomIdInPath:
      name: roomId
      in: path
      required: true
      description: ルームUUID
      schema:
        type: string
        format: uuid
    roomIdInQuery:
      in: query
      name: roomId
      schema:
        type: string
        format: uuid
      description: ルームUUID
    isWebinarInQuery:
      in: query
      name: isWebinar
      schema:
        type: boolean
      required: false
      description: ウェビナールームかどうか(デフォルト false)
    excludeDeletedMessagesInQuery:
      in: query
      name: exclude-deleted-messages
      schema:
        type: boolean
      required: false
      description: 削除されたメッセージを除外するかどうか(デフォルト false)

