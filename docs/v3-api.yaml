  "/public/icon/{username}":
    parameters:
      - name: username
        in: path
        required: true
        description: ユーザー名
        schema:
          type: string
          pattern: "^([a-zA-Z0-9_-]{1,32}|Webhook#[a-zA-Z0-9_-]{22})$"
    get:
      summary: ユーザーのアイコン画像を取得
      tags:
