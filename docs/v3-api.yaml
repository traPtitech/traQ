  /oauth2/token:
    post:
      tags:
        - oauth2
      operationId: postOAuth2Token
      security:
        - clientBasicAuth: []
        - {}
      description: |-
        authorization_code・password・client_credentials・refresh_tokenに対応します。クライアント認証はHTTP Basicを優先し、なければフォームのclient_id/client_secretを使います。confidential clientではsecretが必要で、client_credentialsはconfidential clientのみ利用できます。
        authorization_codeはcode、passwordはusername/password、refresh_tokenはrefresh_tokenが必須です。codeは有効期間5分・一度限りで、交換時のredirect_uriは認可要求時の値（省略を含む）と一致する必要があり、不一致は401 invalid_grantです。PKCE不一致やchallengeなしのverifierは400 invalid_requestです。
        scope省略時はクライアント（refresh時は元トークン）のscopeを使い、指定時は利用可能なscopeとの共通部分を発行します。public clientのrefreshではclient_idを要求しません。
        openidはID tokenを発行し、profileは追加プロフィールclaimを含めます。openidを含む場合はrefresh tokenを発行しません。それ以外のrefresh token発行はサーバー設定に従い、client_credentialsでは発行しません。refresh成功時は旧トークンを失効させます。
        エラー応答はerrorと任意のerror_descriptionを持つJSONです。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PostOAuth2Token"
      responses:
        "200":
          description: トークンが正常に発行されました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Token"
        "400":
          description: トークン発行に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
        "401":
          description: クライアント認証・ユーザー認証・redirect URI検証に失敗しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
        "500":
          description: トークン発行時のサーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
      summary: OAuth2 トークンエンドポイント
  /oauth2/authorize/decide:
    post:
      tags:
        - oauth2
      operationId: postOAuth2AuthorizeDecide
      security:
        - cookieAuth: []
      description: |-
        認可要求から5分以内にsubmit=approveを送ると承認し、それ以外はaccess_deniedを返します。認可要求を保存したセッションcookieが必要です。未認証は401、Botは403です。
        AuthorizationヘッダがあればBearer認証を先に検証しますが、認可要求を保存したcookieも必要です。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuth2Decide"
      responses:
        "302":
          description: RedirectURIに結果をリダイレクトします。
        "400":
          description: リクエストが不正です。
        "401":
          description: 未認証
        "403":
          description: リクエストが許可されていません。
      summary: OAuth2 認可承諾API
  /oauth2/authorize:
    get:
      tags:
        - oauth2
      operationId: getOAuth2Authorize
      security: []
      description: |-
        response_typeはcodeのみで、未指定はinvalid_request、未対応値はunsupported_response_typeです。promptは省略またはnoneのみ対応します。
        クライアント・redirect URIの検証前後の直接エラーはmessage形式のJSONです。検証済みredirect URIにはcodeまたはerrorとstateをクエリで返し、元のクエリを保持します。未ログイン時は/login、同意が必要な場合は/consentへ302で遷移します。
        redirect_uriは登録値と完全一致が必要です。ただしhttpのloopback IPアドレスでは、portだけの相違を許可します。省略時は登録値を使います。
        PKCEはplain/S256に対応し、method省略時はplainです。http(s)以外のredirect URIではS256が必須で、prompt=noneはconsent_requiredになります。prompt=noneはログイン済みかつ要求scopeを承認済みの場合だけ成功します。
        ログイン状態はセッションcookieで確認します。Bearerヘッダによるログイン判定は行いません。
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OAuth2ResponseType"
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
        - name: nonce
          in: query
          schema:
            type: string
        - name: prompt
          in: query
          schema:
            $ref: "#/components/schemas/OAuth2Prompt"
      responses:
        "302":
          description: 結果に応じてリダイレクトします。
        "400":
          description: リクエストが不正です。
        "403":
          description: リクエストが許可されていません。
      summary: OAuth2 認可エンドポイント
    post:
      tags:
        - oauth2
      operationId: postOAuth2Authorize
      security: []
      description: |-
        response_typeはcodeのみで、未指定はinvalid_request、未対応値はunsupported_response_typeです。promptは省略またはnoneのみ対応します。
        クライアント・redirect URIの検証前後の直接エラーはmessage形式のJSONです。検証済みredirect URIにはcodeまたはerrorとstateをクエリで返し、元のクエリを保持します。未ログイン時は/login、同意が必要な場合は/consentへ302で遷移します。
        redirect_uriは登録値と完全一致が必要です。ただしhttpのloopback IPアドレスでは、portだけの相違を許可します。省略時は登録値を使います。
        PKCEはplain/S256に対応し、method省略時はplainです。http(s)以外のredirect URIではS256が必須で、prompt=noneはconsent_requiredになります。prompt=noneはログイン済みかつ要求scopeを承認済みの場合だけ成功します。
        ログイン状態はセッションcookieで確認します。Bearerヘッダによるログイン判定は行いません。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuth2Authorization"
      responses:
        "302":
          description: 結果に応じてリダイレクトします。
        "400":
          description: リクエストが不正です。
        "403":
          description: リクエストが許可されていません。
      summary: OAuth2 認可エンドポイント
  /oauth2/revoke:
