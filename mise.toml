[tools]
go = "1.27.1"
"go:github.com/google/wire/cmd/wire" = "0.7.0"
"go:github.com/golang/mock/mockgen" = "1.6.0"
golangci-lint = "2.14.0"

[vars]
test_db_port = "3100"
# renovate:image-full-digest
tbls_image = "ghcr.io/k1low/tbls:v1.96.1@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79"
# renovate:image-full-digest
spectral_image = "index.docker.io/stoplight/spectral:6.17.0@sha256:c8ffae6ee561b70e80402f1ea669e8b37c74fee48a3dbe2147b71359ed987239"

[tasks.help]
description = "Display this help screen"
alias = "default"
run = "mise tasks ls"

[tasks.traQ]
description = "Build traQ binary"
sources = ["**/*.go", "**/go.mod", "**/go.sum"]
outputs = ["traQ"]
env = { CGO_ENABLED = "0" }
run = 'go build -o traQ -ldflags "-s -w -X main.version=Dev -X main.revision=Local"'

[tasks.init]
description = "Download go mod dependencies"
run = "go mod download"

[tasks.genkey]
description = "Generate dev keys"
run = """
mkdir -p ./dev/keys
cd ./dev/keys && go run ../bin/gen_ec_pem.go
"""

[tasks.test]
description = "Run test"
env = { MARIADB_PORT = "{{vars.test_db_port}}" }
run = "go test ./... -race -shuffle=on"

[tasks.up-test-db]
description = "Make sure the test db container is running"
env = { TEST_DB_PORT = "{{vars.test_db_port}}" }
run = "./dev/bin/up-test-db.sh"

[tasks.rm-test-db]
description = "Remove the test db container"
run = "./dev/bin/down-test-db.sh"

[tasks.lint]
description = "Lint go and swagger files"
run = ["mise run golangci-lint", "mise run swagger-lint"]

[tasks.golangci-lint]
description = "Lint go files"
run = "golangci-lint run"

[tasks.swagger-lint]
description = "Lint swagger file"
run = 'docker run --rm -it -v "$PWD:/tmp" {{vars.spectral_image}} lint -r /tmp/.spectral.yml -q /tmp/docs/v3-api.yaml'

[tasks.db-gen-docs]
description = "Generate db docs in docs/dbSchema"
run = [
  "TRAQ_MARIADB_PORT={{vars.test_db_port}} go run main.go migrate --reset",
  'docker run --rm --net=host -e TBLS_DSN="mariadb://root:password@127.0.0.1:{{vars.test_db_port}}/traq" -v "$PWD:/work" -w /work {{vars.tbls_image}} doc -c .tbls.yml --rm-dist',
]

[tasks.db-diff-docs]
description = "List diff of db docs"
run = [
  "TRAQ_MARIADB_PORT={{vars.test_db_port}} go run main.go migrate --reset",
  'docker run --rm --net=host -e TBLS_DSN="mariadb://root:password@127.0.0.1:{{vars.test_db_port}}/traq" -v "$PWD:/work" -w /work {{vars.tbls_image}} diff -c .tbls.yml',
]

[tasks.db-lint]
description = "Lint db docs according to .tbls.yml"
run = [
  "TRAQ_MARIADB_PORT={{vars.test_db_port}} go run main.go migrate --reset",
  'docker run --rm --net=host -e TBLS_DSN="mariadb://root:password@127.0.0.1:{{vars.test_db_port}}/traq" -v "$PWD:/work" -w /work {{vars.tbls_image}} lint -c .tbls.yml',
]

[tasks.up]
description = "Build and start the app containers"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop and remove app containers"
run = "docker compose down"

[tasks.seed]
description = "Seed users, channels, messages, and stamps into the database"
run = "docker compose run --rm --entrypoint ./traQ backend seed"

[tasks.gogen]
description = "Generate auto-generated go files"
run = "go generate ./..."
